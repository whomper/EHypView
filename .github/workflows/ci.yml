name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit and golden tests
        run: make test
      - name: Sanitizers
        run: make asan

  m68k:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install m68k cross compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu qemu-user-static
      - name: Big-endian 68020 tests under QEMU
        run: make m68k-test

  atari:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install m68k cross compiler and Hatari
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu hatari xvfb xdotool x11-utils \
            autoconf automake libtool gettext autopoint pkg-config
      - name: Build the Atari programs and run them in Hatari (Falcon, EmuTOS)
        run: make hatari-test
      - name: The guide, EHYPVIEW.HYP (hcp), read by EHypView's own reader
        run: |
          common/tools/build-hcp.sh "$RUNNER_TEMP/hcp"
          make help HCP="$RUNNER_TEMP/hcp/hcp"
      - name: Drive the viewer in Hatari with the keyboard and mouse
        run: make gui-test
      - name: The accessory's quiet start, measured in Hatari
        run: make quiet-test
      - name: Pictures and coloured text in every screen mode, in Hatari
        run: make colour-test
      - name: The build changed no tracked file
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
